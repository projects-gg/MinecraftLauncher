[package]
name = "projects-launcher"
description = "Projects Launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "projects-launcher"

[lib]
name = "projects_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
fs4 = "1.1"
semver = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
pl-net = { workspace = true }
pl-mc = { workspace = true }
pl-auth = { workspace = true }
pl-content = { workspace = true }
pl-afk = { workspace = true }
pl-discord = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-updater = { workspace = true }
