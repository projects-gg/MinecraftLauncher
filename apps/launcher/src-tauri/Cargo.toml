[package]
name = "projects-launcher"
description = "Projects Launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "projects-launcher"

[lib]
name = "projects_launcher_lib"
crate-type = ["rlib"]

# A developer tool: the feature keeps it out of release builds, so `tauri build` does not bundle
# it into the installers. `cargo run -p projects-launcher --features export-bindings --bin export-bindings`
[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["export-bindings"]

[features]
export-bindings = []

[build-dependencies]
tauri-build = { workspace = true }
# build.rs reads the in-game overlay's jar index before a release build (OVL-B).
serde_json = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
walkdir = { workspace = true }
fs4 = "1.1"
semver = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
pl-net = { workspace = true }
pl-mc = { workspace = true }
pl-auth = { workspace = true }
pl-content = { workspace = true }
pl-afk = { workspace = true }
pl-discord = { workspace = true }
pl-data = { workspace = true }
pl-social = { workspace = true }
pl-desktop = { workspace = true }
pl-lang = { workspace = true }
pl-import = { workspace = true }
pl-overlay = { workspace = true }
pl-cloud-afk = { workspace = true }
pl-host = { workspace = true }
pl-worlds = { workspace = true }
pl-items = { workspace = true }
pl-voice = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-updater = { workspace = true }

# The page's rest while the window is out of sight (webview_rest.rs) and the system notifications
# (notify.rs): the versions and features Tauri, its notification plugin and pl-auth already build,
# so nothing new is compiled. Voice chat (voice/, VOICE) names what it uses: process times and
# memory for VOICE-0's probe (Threading, ProcessStatus: sysinfo's), Raw Input with its hidden
# window and the last touch for the inactivity rule (UI_Input, UI_Input_KeyboardAndMouse,
# System_SystemInformation, Gdi, LibraryLoader: tao's and wry's), and the keyboard layout for
# Discord's keys (UI_TextServices, VOICE-KEYS: tao's), so the shared `windows` build stays the
# same.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
