plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// One source tree, one jar per Minecraft version: -Pmc=26.1.2 (the default), 26.2 or 26.3. Each version adds
// its small compatibility source set (src/<compat>/java) and pins its own range in fabric.mod.json.
// Adding a version: a row here, src/<compat>/java/gg/projects/overlay/compat/Compat.java, the CI matrix.
def targets = [
    '26.1.2': [minecraft: '26.1.2', fabricApi: '0.152.1+26.1.2', range: '~26.1.2', compat: 'mc26_1'],
    '26.2'  : [minecraft: '26.2', fabricApi: '0.161.0+26.2', range: '~26.2', compat: 'mc26_2'],
    '26.3'  : [minecraft: '26.3', fabricApi: '0.164.0+26.3', range: '~26.3', compat: 'mc26_3'],
]
def mc = providers.gradleProperty('mc').getOrElse(project.default_mc)
def target = targets[mc]
// CI's try of a Minecraft version without a row here (OVL-AUTO, .github/workflows/overlay-auto.yml): an existing
// compatibility source set and the Fabric API to build against, -Pmc=26.4 -Povl.compat=mc26_3
// -Povl.fabricApi=0.170.0+26.4 (the range defaults to ~<version>, else -Povl.range=).
if (target == null && providers.gradleProperty('ovl.compat').isPresent()) {
    def fabricApi = providers.gradleProperty('ovl.fabricApi').getOrNull()
    if (fabricApi == null) {
        throw new GradleException("A try of Minecraft '${mc}' needs -Povl.fabricApi= beside -Povl.compat=")
    }
    target = [
        minecraft: mc,
        fabricApi: fabricApi,
        range    : providers.gradleProperty('ovl.range').getOrElse('~' + mc),
        compat   : providers.gradleProperty('ovl.compat').get(),
    ]
}
if (target == null) {
    throw new GradleException(
        "Unknown Minecraft version '${mc}' (-Pmc=): one of ${targets.keySet()}, or a try with -Povl.compat= and -Povl.fabricApi=")
}

version = "${project.mod_version}+${target.minecraft}"
group = project.maven_group

base {
    archivesName = 'projects-overlay'
}

// Local runs can keep build output outside the working tree (-Povl.buildDir=<dir>).
def buildDirOverride = providers.gradleProperty('ovl.buildDir')
if (buildDirOverride.isPresent()) {
    layout.buildDirectory = file(buildDirOverride.get())
}

sourceSets {
    main {
        java {
            srcDir "src/${target.compat}/java"
        }
    }
    // Test driver for runClient only (scripted scenario, frame timing). Never part of the released jar.
    dev {
        java {
            srcDir "src/${target.compat}/dev/java"
        }
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
    // The client game test's game (OVL-AUTO): Fabric API beside the built jar, as players have it.
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The client game test (OVL-AUTO): one smoke test (src/gametest) that Fabric's client game test API runs in a real
// game: the mod loads, the pause menu, its panel key and the chat's emoji picker work. Its own small mod, never in the
// jar players get. CI runs it against that jar (runProductionClientGameTest below) before Studio may publish the jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'projects_overlay_gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}

def gametestJar = tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}

// The game test against the built jar, as players get it: Fabric's production launcher with the mod's jar, the test's
// and Fabric API (under xvfb on CI). The launcher's bridge properties start the overlay as the launcher does; nothing
// listens on the port, so it runs as it does while the launcher is away. Screenshots land in its run folder.
tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(gametestJar)
    jvmArgs.add('-Dfabric.client.gametest')
    // Fabric's advice for game tests on GitHub's runners (an error in the network synchronizer).
    jvmArgs.add('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
    jvmArgs.add('-Dprojects.overlay.port=47652')
    jvmArgs.add('-Dprojects.overlay.token=gametest-gametest-gametest-gametest')
    runDir = layout.buildDirectory.dir('run/productionClientGameTest').get().asFile
}

loom {
    mods {
        projects_overlay {
            sourceSet sourceSets.main
        }
        projects_overlay_dev {
            sourceSet sourceSets.dev
        }
    }

    runs {
        client {
            source sourceSets.dev
            runDir = providers.gradleProperty('ovl.runDir').getOrElse('run')
            programArgs '--username', providers.gradleProperty('ovl.username').getOrElse('OVL2Test'),
                '--width', providers.gradleProperty('ovl.width').getOrElse('1280'),
                '--height', providers.gradleProperty('ovl.height').getOrElse('720')
            // The game's own quick play, as a launcher passes it (OVL-FIX's resume runs): -Povl.quickPlay=<world folder>
            // or -Povl.quickPlayServer=<host[:port]>.
            def quickPlayWorld = providers.gradleProperty('ovl.quickPlay')
            if (quickPlayWorld.isPresent()) {
                programArgs '--quickPlaySingleplayer', quickPlayWorld.get()
            }
            def quickPlayServer = providers.gradleProperty('ovl.quickPlayServer')
            if (quickPlayServer.isPresent()) {
                programArgs '--quickPlayMultiplayer', quickPlayServer.get()
            }
            vmArgs '-Xmx2G'
            // Extra JVM arguments for measurement runs, separated by ';' (gradlew.bat passes '|' to cmd), e.g. a
            // flight recording: -Povl.jvmArgs=-XX:StartFlightRecording=settings=profile,filename=run.jfr
            def extraJvmArgs = providers.gradleProperty('ovl.jvmArgs')
            if (extraJvmArgs.isPresent()) {
                extraJvmArgs.get().split(';').findAll { !it.isBlank() }.each { vmArg it.strip() }
            }
            // The launcher passes these on the real command line; local runs take them as Gradle properties.
            [
                'port'      : 'ovl.port',
                'token'     : 'ovl.token',
                // The overlay's language as the game starts (OVL-LANG: the launcher's, or the player's pick).
                'lang'      : 'ovl.lang',
                // "Devam et" into a world through the overlay (OVL-FIX): the world's folder, percent-encoded UTF-8.
                'world'     : 'ovl.world',
                'perf'      : 'ovl.perf',
                'dev.script': 'ovl.script',
                'dev.out'   : 'ovl.out',
                'dev.server': 'ovl.server',
                // The same world for the resume scenario's record (the overlay clears its own property once read).
                'dev.world' : 'ovl.world',
                // CHAT-EMOJI: the launcher's switches as it passes them (off only), the scenario's mode and the server
                // pack's pictures for its test pack.
                'panel'     : 'ovl.panel',
                'emoji'     : 'ovl.emoji',
                'dev.emoji' : 'ovl.devEmoji',
                'dev.packart': 'ovl.packart',
            ].each { name, property ->
                def value = providers.gradleProperty(property)
                if (value.isPresent()) {
                    vmArg "-Dprojects.overlay.${name}=${value.get()}"
                }
            }
        }
    }
}

processResources {
    def props = [version: project.version, minecraft_range: target.range]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }

    // The chat stickers come from the shared package (packages/stickers, CHAT2 §8.3): the set's manifest (names,
    // atlas cells, motion) and its atlas for the overlay, one 8 x 4 grid of 160 px tiles.
    def stickers = file('../../packages/stickers/pl1')
    from(stickers) {
        include 'manifest.json'
        rename 'manifest.json', 'pl1.json'
        into 'assets/projects_overlay/stickers'
    }
    from(new File(stickers, 'overlay')) {
        include 'pl1-atlas.png'
        rename 'pl1-atlas.png', 'pl1.png'
        into 'assets/projects_overlay/stickers'
    }

    // The Projects server's chat emojis the launcher uses while Studio has published none (CHAT-EMOJI): the picker's
    // list while the launcher has said nothing, the same file.
    from(file('../../crates/pl-content/data')) {
        include 'chat-emojis.json'
        rename 'chat-emojis.json', 'projects.json'
        into 'assets/projects_overlay/emojis'
    }
}

// The mod is GPL-3.0-only: every jar carries the license text at its root, named as Fabric's mod template names it
// (LICENSE_<archive name>, so it never clashes with another mod's LICENSE in a merged or nested jar).
// scripts/release/overlay-jars.mjs refuses a jar without it.
jar {
    inputs.property 'archivesName', base.archivesName
    from(file('../../LICENSE')) {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    // World sharing's shared test vectors (HOST1-C): the gate's headers and the name binding rules.
    systemProperty 'projects.testdata', file('../../crates/pl-host/testdata').absolutePath
}
