plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'projects-overlay'
}

// Local runs can keep build output outside the working tree (-Povl.buildDir=<dir>).
def buildDirOverride = providers.gradleProperty('ovl.buildDir')
if (buildDirOverride.isPresent()) {
    layout.buildDirectory = file(buildDirOverride.get())
}

sourceSets {
    // Test driver for runClient only (scripted scenario, frame timing). Never part of the released jar.
    dev {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    mods {
        projects_overlay {
            sourceSet sourceSets.main
        }
        projects_overlay_dev {
            sourceSet sourceSets.dev
        }
    }

    runs {
        client {
            source sourceSets.dev
            runDir = providers.gradleProperty('ovl.runDir').getOrElse('run')
            programArgs '--username', providers.gradleProperty('ovl.username').getOrElse('OVL1Test'),
                '--width', '1280', '--height', '720'
            vmArgs '-Xmx2G'
            // The launcher passes these on the real command line; local runs take them as Gradle properties.
            [
                'port'      : 'ovl.port',
                'token'     : 'ovl.token',
                'perf'      : 'ovl.perf',
                'dev.script': 'ovl.script',
                'dev.out'   : 'ovl.out',
            ].each { name, property ->
                def value = providers.gradleProperty(property)
                if (value.isPresent()) {
                    vmArg "-Dprojects.overlay.${name}=${value.get()}"
                }
            }
        }
    }
}

processResources {
    def version = project.version
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}
