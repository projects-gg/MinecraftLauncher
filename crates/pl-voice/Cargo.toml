[package]
name = "pl-voice"
description = "Voice chat on the launcher side: the call state machine, the room socket, settings and shortcuts, and the voice window's rules (microphone, policy, life)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Backoff with jitter and the TLS of the friends service's sockets.
pl-social = { workspace = true }
# SHARE-LIVE: a share's still picture on the room socket (`share_thumb.jpg`).
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
# The page's types are exported to TypeScript by the launcher (tauri-specta).
specta = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
# The room socket: the same WebSocket and TLS stack as the presence socket (pl-social), so nothing
# new is compiled.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
