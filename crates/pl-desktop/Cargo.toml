[package]
name = "pl-desktop"
description = "Desktop integration without Tauri: projects:// links, desktop shortcuts, shortcut icons, process identity, the game's window, what closing the window does, the Discord app, the text of system notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
# The page's close choice (close::parse_choice).
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# DeepLink is exported to TypeScript by the launcher (tauri-specta).
specta = { workspace = true }
# Who started the process that owns a game window (a wrapper command's Java), and whether a game
# the launcher left running is still that game (process).
sysinfo = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Shell links through IShellLinkW, the game's window (game_window), waiting for a game the
# launcher left running (process). Only features Tauri's window layer already enables, so the
# shared `windows` build is reused.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# Real windows in the game_window test.
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
