[package]
name = "pl-mc"
description = "Minecraft version metadata, installation, mod loaders, Java runtimes and launching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pl-net = { workspace = true }
# The game's first language and the sizes in messages follow the interface's (pl-lang).
pl-lang = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
quick-xml = { workspace = true }
fastnbt = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
md-5 = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
zip = { workspace = true }
walkdir = { workspace = true }
dirs = { workspace = true }
sysinfo = { workspace = true }
parking_lot = { workspace = true }
which = { workspace = true }
specta = { workspace = true }
flate2 = "1.1"
# Screenshot thumbnails (decode PNG/JPEG, encode JPEG); same features as Studio's.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hickory-resolver = "0.26"
trash = "5.2"
base64 = { workspace = true }
same-file = "1.0.6"
# The screenshots folder while a game runs (ReadDirectoryChangesW, inotify, FSEvents; no polling).
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tempfile = { workspace = true }
