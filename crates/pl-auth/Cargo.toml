[package]
name = "pl-auth"
description = "Microsoft (Xbox Live / Minecraft Services) and offline accounts, secure token storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pl-net = { workspace = true }
tokio = { workspace = true }
# `multipart` for skin uploads. Form bodies are encoded with `url::form_urlencoded`.
reqwest = { workspace = true, features = ["multipart"] }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
keyring = { workspace = true }
parking_lot = { workspace = true }
specta = { workspace = true }
# Player heads: decode skin textures, encode the 8×8 face; default skins from client jars.
png = "0.18"
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
# DPAPI, to import the legacy launcher's premium session (`%APPDATA%\.projects\premium.dat`).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = { workspace = true }
