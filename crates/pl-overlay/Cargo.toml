[package]
name = "pl-overlay"
description = "Local bridge between Projects Launcher and the in-game overlay mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# What the overlay shows comes from the friends feature's views and goes back to its actions.
pl-social = { workspace = true }
# The overlay's language (OVL-LANG: the player's pick in it, else the launcher's) and the words the
# launcher writes for it ("Biri" / "Someone").
pl-lang = { workspace = true }
# The mod's jar in a game folder (install.rs): the mods folder scan, the pre-launch mod check, the
# version ranges and atomic writes are the launcher's own; files are hashed the downloader's way.
pl-mc = { workspace = true }
pl-net = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The page's overlay settings and the connection status are exported to TypeScript (tauri-specta).
specta = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zip = { workspace = true }
