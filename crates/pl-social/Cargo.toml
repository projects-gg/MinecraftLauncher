[package]
name = "pl-social"
description = "Client for the Projects Launcher friends service: HTTP API and presence WebSocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
# Finding the links of a chat message as the service does (CHAT2: a message's card).
regex = { workspace = true }
# "Birlikte oynanan süre" counts by the local week and month.
jiff = { workspace = true }
# UI-facing views are exported to TypeScript by the launcher (tauri-specta).
specta = { workspace = true }
# The session token lives in the OS keychain (same service as the rest of the launcher).
keyring = { workspace = true }
# The friend code QR, drawn by the launcher as an SVG path (no image dependencies).
qrcode = { version = "0.14.1", default-features = false }
# Presence WebSocket. TLS goes through rustls with the platform verifier and the aws-lc-rs
# provider, the same stack reqwest already uses in this workspace (no new crypto features).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
