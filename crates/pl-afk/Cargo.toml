[package]
name = "pl-afk"
description = "AFK accounts: Projects Console Client (MCC fork) runtime, config writer and session manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pl-net = { workspace = true }
# MCC's language follows the launcher's (pl-lang).
pl-lang = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
zip = { workspace = true }
parking_lot = { workspace = true }
# Login commands in the OS keychain (`KeyringSecretStore`), behind the default `keychain` feature:
# the cloud AFK host builds without it, so no D-Bus or keychain backend reaches its Linux build.
keyring = { workspace = true, optional = true }
specta = { workspace = true }
# Auto-respond regex checks (the parser behind `regex`, already in the lock file).
regex-syntax = "0.8"
# Start time and command line of AFK clients a crashed launcher left running.
sysinfo = { workspace = true }

[features]
default = ["keychain"]
# `KeyringSecretStore`: Windows Credential Manager, macOS Keychain, Linux Secret Service.
keychain = ["dep:keyring"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Reads the generated MinecraftClient.ini back as TOML in tests.
toml = { workspace = true }

# Test-only stand-in for the Projects Console Client: prints scripted bridge lines and exits with
# scripted codes so the session state machine can be exercised end to end without a server.
# Never shipped: the app depends on this crate as a library, which does not build its binaries.
[[bin]]
name = "pl-afk-fake-mcc"
path = "tests/support/fake_mcc.rs"
test = false
doc = false
bench = false
