# Projects Launcher tarafından üretildi.
# Bu dosya her bağlanışta yeniden yazılır; elle yapılan değişiklikler kaybolur.
# Ayarları başlatıcıdaki AFK Hesapları ekranından düzenleyin.

[Main]

[Main.General]
Account = { Login = "Bilinmeyen", Password = "-" }
Server = { Host = "play.projects.gg" }

[Main.Advanced]
EnableSentry = false
Language = "tr_tr"
ConsoleTitle = ""
PlayerHeadAsIcon = false
ShowGithubStarReminder = false
ExitOnFailure = true
MinecraftVersion = "26.3"
LoadResourcePackTranslations = false
AutoRespawn = true
TerrainAndMovements = false
InventoryHandling = false
EntityHandling = false
SessionCache = "none"
ProfileKeyCache = "none"
BotOwners = [ ]

[Console]

[Console.General]
ConsoleMode = "classic"
Display_Icon_Banner = false

[ChatBot]

[ChatBot.Alerts]
Enabled = false
Beep_Enabled = false
Trigger_By_Words = true
Trigger_By_Rain = false
Trigger_By_Thunderstorm = false
Log_To_File = true
Log_File = "uyarilar.txt"
Matches = [ ]
Excludes = [ ]

[ChatBot.AntiAFK]
Enabled = true
Delay = { min = 60.0, max = 90.0 }
Command = ""
Use_Sneak = true
Use_Terrain_Handling = false
Walk_Range = 5
Walk_Retries = 20

[ChatBot.AutoEat]
Enabled = false
Threshold = 6

[ChatBot.AutoRelog]
Enabled = true
Delay = { min = 5.0, max = 10.0 }
Retries = -1
Ignore_Kick_Message = true
Kick_Messages = [ "Connection has been lost", "Server is restarting", "Server is full", "Too Many people" ]

[ChatBot.AutoRespond]
Enabled = true
Matches_File = "matches.ini"
Match_Colors = false

[ChatBot.ChatLog]
Enabled = false
Add_DateTime = true
Log_File = "sohbet.txt"
Filter = "messages"

[ChatBot.ScriptScheduler]
Enabled = false
TaskList = [ ]

