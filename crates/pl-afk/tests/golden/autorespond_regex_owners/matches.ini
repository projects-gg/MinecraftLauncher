# Projects Launcher tarafından üretildi. Elle yapılan değişiklikler kaybolur.

[Match]
regex=^\[Özel\] (\w+) -> sen: (.*)$
actionprivate=send /msg $u Şu an AFK'yım.
ownersonly=false
cooldown=5

[Match]
match=!gel
action=send /tpa Hazar
ownersonly=true
cooldown=0

[Match]
match=duyuru "önemli"
actionother=log Duyuru görüldü
ownersonly=false
cooldown=0

[Match]
regex=(?i)satıyorum\s+\d+
action=script cevap.txt
actionprivate=send /r ilgilenmiyorum
actionother=log ilan
ownersonly=true
cooldown=120

