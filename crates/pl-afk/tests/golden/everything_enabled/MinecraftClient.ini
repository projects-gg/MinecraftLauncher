# Projects Launcher tarafından üretildi.
# Bu dosya her bağlanışta yeniden yazılır; elle yapılan değişiklikler kaybolur.
# Ayarları başlatıcıdaki AFK Hesapları ekranından düzenleyin.

[Main]

[Main.General]
Account = { Login = "Tam_Donanim", Password = "-" }
Server = { Host = "mc.example.org", Port = 25570 }

[Main.Advanced]
EnableSentry = false
Language = "tr_tr"
ConsoleTitle = ""
PlayerHeadAsIcon = false
ShowGithubStarReminder = false
ExitOnFailure = true
MinecraftVersion = "1.21.9"
LoadResourcePackTranslations = true
AutoRespawn = true
TerrainAndMovements = true
InventoryHandling = true
EntityHandling = false
SessionCache = "none"
ProfileKeyCache = "none"
BotOwners = [ "Hazar" ]

[Console]

[Console.General]
ConsoleMode = "classic"
Display_Icon_Banner = false

[ChatBot]

[ChatBot.Alerts]
Enabled = true
Beep_Enabled = true
Trigger_By_Words = true
Trigger_By_Rain = false
Trigger_By_Thunderstorm = false
Log_To_File = false
Log_File = "uyarilar.txt"
Matches = [ "Hazar", "admin" ]
Excludes = [ "spam" ]

[ChatBot.AntiAFK]
Enabled = true
Delay = { min = 45.5, max = 120.25 }
Command = "/afk"
Use_Sneak = false
Use_Terrain_Handling = true
Walk_Range = 8
Walk_Retries = 30

[ChatBot.AutoEat]
Enabled = true
Threshold = 10

[ChatBot.AutoRelog]
Enabled = true
Delay = { min = 3.0, max = 12.0 }
Retries = 7
Ignore_Kick_Message = false
Kick_Messages = [ "Server is restarting", "Sunucu dolu", "Bağlantı koptu" ]

[ChatBot.AutoRespond]
Enabled = true
Matches_File = "matches.ini"
Match_Colors = false

[ChatBot.ChatLog]
Enabled = true
Add_DateTime = false
Log_File = "sohbet.txt"
Filter = "all"

[ChatBot.ScriptScheduler]
Enabled = true

[[ChatBot.ScriptScheduler.TaskList]]
Task_Name = "Kit"
Trigger_On_First_Login = false
Trigger_On_Login = true
Trigger_On_Times = { Enable = false, Times = [ ] }
Trigger_On_Interval = { Enable = true, MinTime = 3600.0, MaxTime = 7200.0 }
Action = "send /kit günlük"

[[ChatBot.ScriptScheduler.TaskList]]
Task_Name = "Giriş Komutları"
Trigger_On_First_Login = false
Trigger_On_Login = true
Trigger_On_Times = { Enable = false, Times = [ ] }
Trigger_On_Interval = { Enable = false, MinTime = 300.0, MaxTime = 600.0 }
Action = "script giris-komutlari.txt"

