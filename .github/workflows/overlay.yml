name: Overlay mod

# The in-game overlay's Fabric mod (mods/projects-overlay): compile, JUnit and the jar, with its SHA-256, once per
# Minecraft version (one jar each, built from the same tree with -Pmc; build.gradle pins Fabric API per version).
# Nothing is published: the jars go into the official pack through Studio, by the owner.

on:
  push:
    branches: [v2, main]
    paths:
      - "mods/projects-overlay/**"
      - "crates/pl-overlay/**"
      - ".github/workflows/overlay.yml"
  pull_request:
    branches: [v2, main]
    paths:
      - "mods/projects-overlay/**"
      - "crates/pl-overlay/**"
      - ".github/workflows/overlay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mod:
    name: Fabric mod (Minecraft ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2", "26.3"]
    defaults:
      run:
        working-directory: mods/projects-overlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle and Loom's Minecraft files; also checks the wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/v2' }}

      - name: Build, test and package
        run: ./gradlew build --no-daemon --console=plain -Pmc=${{ matrix.minecraft }}

      - name: Checksum
        run: |
          cd build/libs
          sha256sum projects-overlay-*.jar > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projects-overlay-${{ matrix.minecraft }}
          path: |
            mods/projects-overlay/build/libs/projects-overlay-*.jar
            mods/projects-overlay/build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
