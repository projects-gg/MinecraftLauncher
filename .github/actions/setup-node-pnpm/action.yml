name: Set up Node and pnpm
description: >-
  Node 24 and the pnpm version pinned in package.json ("packageManager") through Corepack,
  with a cached pnpm store and a frozen-lockfile install.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Enable Corepack
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: |
        corepack enable
        echo "pnpm $(pnpm --version)"
        echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
